[project]
name = "invoice-extraction-automation"
version = "0.1.0"
description = "Extract GST invoice and receipt data with Gemini, cross-check totals and GST, flag duplicates, and write a review-ready Excel workbook."
readme = "README.md"
license = "MIT"
authors = [{ name = "Kaif Attarwala" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=3.3,<4",
    "pydantic>=2.14,<3",
    "pandas>=3.1,<4",
    "openpyxl>=3.1.5,<4",
    "typer>=0.29",
    "watchdog>=7.1",
    "tenacity>=8.2.3",
    "python-dotenv>=1.0",
    # synthetic test-data generator
    "reportlab>=5.1",
    "pypdfium2>=5.15",
    "pillow>=13.0",
]

[project.scripts]
invoice-tool = "invoice_tool.cli:app"
invoice-synth = "invoice_tool.synth.generate:main"
invoice-eval = "invoice_tool.evaluate:main"

[dependency-groups]
dev = ["pytest>=9.2", "pytest-cov>=7.1", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_tool"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",  # line length is handled by ruff format
    "RUF001", "RUF002", "RUF003",  # ₹ and other non-ASCII characters are intentional
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
