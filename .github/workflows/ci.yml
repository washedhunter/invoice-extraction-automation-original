name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests (offline, Gemini mocked)
        run: uv run pytest --cov=invoice_tool --cov-report=term-missing
      - name: Demo on committed samples (recorded responses, no API key)
        run: |
          uv run invoice-tool process samples --replay samples/recorded --out out/demo.xlsx --json-out out/demo.json
          uv run invoice-eval --results out/demo.json --truth samples/ground_truth --strict
